name: Verify and manually promote

# Feature-branch pushes verify the candidate only. Production promotion is a
# separate, operator-started action protected by a typed confirmation and the
# GitHub production environment approval rules.
on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type PROMOTE to fast-forward this ref to master
        required: true
        type: string

concurrency:
  group: verify-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          DATABASE_URL: ci-build-placeholder
          AUTH_SECRET: ci-placeholder-not-a-real-secret-000000000000
          AUTH_URL: http://localhost:3000
        run: npm run build

  promote:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'PROMOTE'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm fast-forward promotion
        id: ff
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "promotable=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to promote — this ref is already master." >> "$GITHUB_STEP_SUMMARY"
          elif git merge-base --is-ancestor origin/master HEAD; then
            echo "promotable=true" >> "$GITHUB_OUTPUT"
            echo "before=$(git rev-parse origin/master)" >> "$GITHUB_OUTPUT"
          else
            echo "promotable=false" >> "$GITHUB_OUTPUT"
            echo "::error::This ref diverged from master and cannot be fast-forwarded."
            exit 1
          fi
      - name: Promote to master
        if: steps.ff.outputs.promotable == 'true'
        env:
          BEFORE: ${{ steps.ff.outputs.before }}
        run: |
          git push origin HEAD:master
          {
            echo "### Promoted to master"
            echo ""
            echo "\`${GITHUB_REF_NAME}\` → \`master\` @ \`$(git rev-parse --short HEAD)\` — Vercel is deploying."
            echo ""
            git log --oneline "${BEFORE}..HEAD" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
